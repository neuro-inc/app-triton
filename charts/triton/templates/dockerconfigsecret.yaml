{{- if .Values.dockerconfigjson }}
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata:
  name: {{ include "triton.dockerconfigSecretName" . }}
  labels:
    {{- include "triton.labels" . | nindent 4 }}
data:
  .dockerconfigjson: {{ .Values.dockerconfigjson | quote }}
{{- end }}
